<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS OS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Achtergrond -->
    <div id="background-grid"></div>

    <!-- Opstartscherm -->
    <main id="startup-screen">

        <!-- Arc Reactor -->
        <div id="arc-reactor">

            <div class="ring outer"></div>
            <div class="ring middle"></div>
            <div class="ring inner"></div>

            <div class="core-glow"></div>
            <div class="core"></div>

        </div>

        <!-- Titel -->
        <h1 id="jarvis-title">JARVIS</h1>

        <!-- Status -->
        <p id="statusText">Initializing...</p>

    </main>

    <!-- Hier komen later de holografische vensters -->
    <div id="workspace"></div>

    <!-- Hier komt later het bedieningspaneel -->
    <div id="control-panel"></div>
<!-- Command Bar -->
<div id="command-bar">

    <input
        type="text"
        id="commandInput"
        placeholder="Type een opdracht..."
        autocomplete="off"
    >

</div>
    <script src="script.js"></script>

</body>

</html>
