<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS OS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Achtergrond -->
    <div id="background"></div>

    <!-- Scanlijnen -->
    <div id="scanlines"></div>

    <!-- HUD -->
    <div id="hud">

        <!-- Arc Reactor -->
        <div id="arc-reactor">

            <div class="ring outer"></div>
            <div class="ring middle"></div>
            <div class="ring inner"></div>

            <div class="coreGlow"></div>
            <div class="core"></div>

        </div>

        <!-- Titel -->
        <h1>JARVIS</h1>

        <!-- Status -->
        <p id="statusText">Initializing...</p>

        <!-- Kleine systeeminformatie -->
        <div id="systemInfo">

            <p>AI CORE : ONLINE</p>
            <p>VOICE : STANDBY</p>
            <p>STATUS : READY</p>

        </div>

    </div>

    <!-- Hier komen later de holografische vensters -->
    <div id="workspace"></div>

    <!-- Hier komen later AI-vensters -->
    <div id="windows"></div>

    <!-- Command Bar (verborgen) -->
    <div id="commandBar">

        <input
            id="commandInput"
            type="text"
            placeholder="Type een opdracht..."
            autocomplete="off">

    </div>

    <script src="script.js"></script>

</body>

</html>
