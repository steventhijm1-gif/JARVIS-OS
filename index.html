<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS OS</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

    <header>
        <h1>J.A.R.V.I.S</h1>
        <p>Just A Rather Very Intelligent System</p>
    </header>

    <main>

        <section id="hud">

            <div id="arc-reactor">

                <div class="ring ring1"></div>
                <div class="ring ring2"></div>
                <div class="ring ring3"></div>

                <div class="core">
                    ONLINE
                </div>

            </div>

        </section>

        <section id="status">

            <h2>Status</h2>

            <p>System Online</p>

        </section>

        <section id="chat">

            <div class="message">

                Hello Steven...

                Waiting for your command.

            </div>

        </section>

        <section id="controls">

            <button id="micButton">

                🎤 Speak

            </button>

            <button id="developerMode">

                ⚙ Developer Mode

            </button>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
